services:
  - type: web
    name: banking-intelligence-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: python -m uvicorn api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: RAG_INDEX_BACKEND
        value: lexical
      - key: LLM_PROVIDER
        value: groq,openai,gemini
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: banking_chat
      - key: ADMIN_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: BACKEND_URL
        value: http://127.0.0.1:10000
